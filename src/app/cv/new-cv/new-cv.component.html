<div class="new-cv-main-div">
  <div class="new-cv-card">
    <form [formGroup]="cvForm" class="column-div cv-form">
      <label *ngIf="!imagePreview">Profile image: </label>
      <input
        *ngIf="!imagePreview"
        type="file"
        (change)="onFileSelected($event)"
        class="add-file-input"
        style="padding: 15px"
      />

      <div *ngIf="imagePreview" class="image-preview row-div">
        <img [src]="imagePreview" />
        <br />

        <button type="button" (click)="removeCurrentImage()">
          Remove Image
        </button>
      </div>
      <div class="column-div create-cv-input-div">
        <div class="row-div">
          <p class="red-star">*</p>
          <label for="firstName">First name: </label>
        </div>
        <input type="text" formControlName="firstName" />
      </div>

      <div class="column-div create-cv-input-div">
        <div class="row-div">
          <p class="red-star">*</p>
          <label for="lastName">Last name: </label>
        </div>
        <input type="text" formControlName="lastName" />
      </div>
      <div class="column-div create-cv-input-div">
        <div class="row-div">
          <p class="red-star">*</p>
          <label for="contact">Contact: </label>
        </div>
        <input type="text" formControlName="contact" />
      </div>
      <div class="column-div create-cv-input-div">
        <label for="description">Description: </label>
        <textarea formControlName="description"></textarea>
      </div>
      <div class="column-div create-cv-input-div">
        <div class="row-div">
          <p class="red-star">*</p>
          <label for="school"> Education: </label>
        </div>
        <textarea formControlName="school"></textarea>
      </div>
      <div class="column-div create-cv-input-div">
        <label for="internships">Internships: </label>
        <textarea formControlName="internships"></textarea>
      </div>
      <div class="column-div create-cv-input-div">
        <label for="experience">Experience: </label>
        <textarea formControlName="experience"></textarea>
      </div>
      <div class="column-div create-cv-input-div">
        <div class="row-div">
          <p class="red-star">*</p>
          <label for="skills">Skills: </label>
        </div>
        <input type="text" formControlName="skills" />
      </div>
      <div class="column-div create-cv-input-div">
        <label for="interests">Interests: </label>
        <input type="text" formControlName="interests" />
      </div>
      <div class="column-div create-cv-input-div">
        <label for="training">Training: </label>
        <textarea formControlName="training"></textarea>
      </div>
      <button
        class="button-primary submit-button"
        [disabled]="cvForm.invalid"
        (click)="createCv()"
      >
        Submit
      </button>
    </form>
  </div>
</div>
